<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Rayan's DNA Protein Translator</title>
    <link rel="stylesheet" href="static/main.css">
</head>

<body>

    <img src="static/Images/dnaBackground.png" class="dna-background">

    <h1>Rayan's DNA Protein Translator</h1>

    <form id="dnaForm">

        <label for="dna_sequence">Enter DNA sequence:</label>

        <br><br>

        <input
            type="text"
            id="dna_sequence"
            name="dna_sequence"
        >

        <br><br>

        <button type="submit">Translate DNA</button>

    </form>

    <div id="result" class="result-box" style="display: none;">
        <h2>Protein Result</h2>

        <p id="proteinResult"></p>
    </div>

    <br>

    <a href="index.html" class="back-Home">Back to Home</a>

    <script>

        const form = document.getElementById("dnaForm");

        form.addEventListenenr("submit", async function(event) {
            // Prevents browser from submitting the form normally.
            // Stop the page from refreshing and lets Javascript handle sending the DNA to the Flask backend.
            event.preventDefault();

            // Find the DNA inout box and get the text the user entered.
            const dna = document.getElementById(
                "dna_sequence"
            ).value;

            // Put DNA into form data so that the DNA can be sent to Flask so that Python can read it.
            const data = new URLSearchParams();

            // Add DNA sequence to the form data using dna_sequence, which matches the name Flask looks for.
            data.append(
                "dna_sequence",
                dna
            );

            // Send DNA sequence to the Python flask backend.
            // POST method is used because we are sending information to the backend, so that it can translate it.
            const response = await fetch(
            "https://flask-website-biology.onrender.com/api/translate",
                {
                    method: "POST",
                    body: data
                }
            );

            // Wait for flask to send back the response then convert the JSON response into Javascript data.
            const result = await response.json();

            // Find protein result element and replace the text with the protein result returned by Python.
            document.getElementById(
                "proteinResult"
            ).textContent = result.protein_result;

            // Make the result visible in the html, so we can see the protein result from the Flask backend.
            document.getElementById(
                "result"
            ).style.display = "block";

        });

    </script>


</body>

</html>
